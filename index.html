<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventesimo Selfwork Javascript</title>
</head>
<body>
    <script>
        let dispari = 0;
        let media = 0;
        for (let i = 1; i <= 20 ; i++){
            if(i % 2 == 0)
            {
                console.log(i+" è un numero pari");
            }else{
                dispari++;
                media += i;
            }
        }
        media = media / dispari;
        console.log("I numeri dispari erano: "+dispari);
        console.log("Media dei numeri dispari: "+media);
    </script>
</body>
</html>
